#file: noinspection YAMLSchemaValidation
name: Unittest

on:
  push:
    paths:
      - 'animetimm/**'
      - 'test/**'
      - 'requirements*.txt'
      - '.github/workflows/unittest.yml'
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: Unittest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6.0,<2.9.0'
          pip install numpy pandas 'accelerate>=1.4.0'
          pip install -r requirements-test.txt
      - name: Run unittest
        shell: bash
        run: |
          # --cov-fail-under=100 is deliberate: this runner has no GPU, so the gate is
          # what guarantees the threshold maths stays fully decidable without one. A new
          # line that only a CUDA machine can reach will fail here rather than quietly
          # becoming untested.
          python -m pytest test/multilabel/test_metrics.py -sv -m unittest \
            --cov=animetimm.multilabel.metrics \
            --cov-report=term-missing \
            --cov-fail-under=100
